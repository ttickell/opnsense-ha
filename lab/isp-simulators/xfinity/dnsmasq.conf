# lab-isp-xfinity: dnsmasq configuration
#
# Simulates Comcast/Xfinity DHCPv6-PD behavior:
#   - Single IPv4 address via DHCP (residential modem behavior)
#   - Two prefix delegations in a single DHCPv6 exchange
#   - DUID-sensitive: the DHCPv6 server binds leases to client DUID
#
# NOTE: Real Xfinity delegates two /60 prefixes. dnsmasq 2.91 does not support
# prefix-len < 64, so the lab approximates with two /64s instead. This is
# sufficient to test all HA failover mechanics. Use ISC dhcpd6 (see end of
# file) if exact /60 fidelity is required.
#
# Xfinity real-world notes (from opnsense-ipv6/readme.md):
#   - Comcast assigns from 2601:346::/32 range; lab uses ULA test equivalents
#   - Comcast requires the Xfinity DUID to be first in the dhcp6c.conf
#     interface list so the primary DUID is used for the Xfinity exchange
#   - Comcast has been observed to be picky about DUID changes
#
# Lab allocations (dnsmasq 2.91: /64 approximation of real Xfinity /60):
#   - Delegation #1: fd03:17ac:e938:4040::/64
#   - Delegation #2: fd03:17ac:e938:4050::/64
#
# Install on Alpine LXC:
#   apk add dnsmasq
#   cp this file to /etc/dnsmasq.conf
#   rc-update add dnsmasq && rc-service dnsmasq start

interface=eth0
except-interface=lo

# Do not use /etc/resolv.conf - this machine is an ISP simulator, not a resolver
no-resolv
no-poll
local=//

# ── IPv4 DHCP ────────────────────────────────────────────────────────────────
# Single address pool (one address, like a residential cable modem).
# The firewall WAN interface will receive 10.220.10.2.
dhcp-range=10.220.10.2,10.220.10.2,255.255.255.252,72h
dhcp-option=option:router,10.220.10.1
dhcp-option=option:dns-server,1.1.1.1,8.8.8.8
dhcp-authoritative

# ── IPv6 ─────────────────────────────────────────────────────────────────────
enable-ra

# Router Advertisement on the VLAN 210 link.
# ra-stateless: SLAAC handles client addressing; DHCPv6 provides options only.
dhcp-range=::, constructor:eth0, ra-stateless, ra-names, 64, 24h

# Prefix Delegation pool - two /64 delegations (dnsmasq 2.91 max is /64).
#
# dhcp6c sends ia-pd 0 and ia-pd 1 (two IA-PD requests in one exchange);
# this server responds with one /64 per IA-PD.
#
# NOTE: constructor:eth0 must NOT be used with explicit address ranges in
# dnsmasq 2.91 — it causes a parse error. Use explicit addresses only.
dhcp-range=fd03:17ac:e938:4040::,fd03:17ac:e938:4040::,64,48h
dhcp-range=fd03:17ac:e938:4050::,fd03:17ac:e938:4050::,64,48h

# DHCPv6 options
dhcp-option=option6:dns-server,[2606:4700:4700::1111],[2606:4700:4700::1001]

# Log DHCP transactions for debugging
log-dhcp

# ── Verification ─────────────────────────────────────────────────────────────
# From the lab firewall WAN console, verify delegation was received:
#   dhcp6c -c /usr/local/etc/dhcp6c.conf vtnet0
#   cat /var/db/ipv6-ha/dhcp6c-delegations.json
#
# Expected: two entries with fd03:17ac:e938:4040::/64 and :4050::/64

# ── Alternative: ISC DHCP (more explicit PD control) ─────────────────────────
# If dnsmasq PD delegation does not behave correctly, replace with isc-dhcp-server6.
# Alpine package: apk add dhcp (for isc-dhcp-server)
# Config: /etc/dhcp/dhcpd6.conf
#
# subnet6 fd03:17ac:e938:4000::/64 {
#     # First IA-PD request gets this /60
#     pool6 {
#         prefix6 fd03:17ac:e938:4040:: fd03:17ac:e938:4040:: /60;
#     }
#     # Second IA-PD request gets this /60
#     pool6 {
#         prefix6 fd03:17ac:e938:4050:: fd03:17ac:e938:4050:: /60;
#     }
#     option dhcp6.name-servers 2606:4700:4700::1111, 2606:4700:4700::1001;
# }
