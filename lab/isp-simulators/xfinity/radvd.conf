# radvd.conf for lab-isp-xfinity
#
# Sends Router Advertisements on eth0 so the firewall WAN (vtnet0) receives
# a default IPv6 route.  Kea handles IA_NA addressing and prefix delegation;
# radvd's only job here is to install the default route via RA.
#
# M=1 (Managed): clients should use DHCPv6 for addresses.
# O=1 (OtherConfig): clients should use DHCPv6 for other options (DNS).
# AdvDefaultLifetime > 0: install a default route toward this router.
#
# Link prefix: fd03:17ac:e938:4000::/64 (same subnet as eth0)

interface eth0 {
    AdvSendAdvert on;
    MinRtrAdvInterval 10;
    MaxRtrAdvInterval 30;
    AdvManagedFlag on;
    AdvOtherConfigFlag on;
    AdvDefaultLifetime 1800;

    prefix fd03:17ac:e938:4000::/64 {
        AdvOnLink on;
        AdvAutonomous off;
        AdvRouterAddr off;
        AdvValidLifetime 172800;
        AdvPreferredLifetime 86400;
    };
};
