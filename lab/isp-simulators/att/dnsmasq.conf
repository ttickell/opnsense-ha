# lab-isp-att: dnsmasq configuration
#
# Simulates AT&T Fiber DHCPv6-PD behavior:
#   - Single IPv4 address via DHCP
#   - Drip-fed /64 prefix delegations (up to 8) from an internal /60 pool
#
# AT&T real-world notes (from opnsense-ipv6/readme.md):
#   - AT&T's CPE holds a /60 and allocates /64s from it one at a time
#   - Each /64 is a separate IA-PD response
#   - Up to 8 /64 delegations available: fd03:17ac:e938:4140::/64 through
#     fd03:17ac:e938:4147::/64 in the lab
#   - Less DUID-sensitive than Xfinity in practice
#   - AT&T delegations arrive at their own pace; dhcp6c must have enough
#     ia-pd stanzas (ia-pd 2 through ia-pd 9 for the 8 AT&T delegations,
#     after ia-pd 0 and ia-pd 1 for the Xfinity /60s)
#
# Lab allocations (8 x /64 from fd03:17ac:e938:4140::/60):
#   fd03:17ac:e938:4140::/64
#   fd03:17ac:e938:4141::/64
#   fd03:17ac:e938:4142::/64
#   fd03:17ac:e938:4143::/64
#   fd03:17ac:e938:4144::/64
#   fd03:17ac:e938:4145::/64
#   fd03:17ac:e938:4146::/64
#   fd03:17ac:e938:4147::/64
#
# Install on Alpine LXC:
#   apk add dnsmasq
#   cp this file to /etc/dnsmasq.conf
#   rc-update add dnsmasq && rc-service dnsmasq start

interface=eth0
except-interface=lo

no-resolv
no-poll
local=//

# ── IPv4 DHCP ────────────────────────────────────────────────────────────────
# Single address (one IPv4 address, like AT&T residential fiber).
# The firewall WAN2 interface receives 10.220.11.2.
dhcp-range=10.220.11.2,10.220.11.2,255.255.255.252,72h
dhcp-option=option:router,10.220.11.1
dhcp-option=option:dns-server,1.1.1.1,8.8.8.8
dhcp-authoritative

# ── IPv6 ─────────────────────────────────────────────────────────────────────
enable-ra

# Router Advertisement on the VLAN 211 link.
dhcp-range=::, constructor:eth0, ra-stateless, ra-names, 64, 24h

# Stateful DHCPv6 address pool (IA_NA).
#
# OPNsense requests IA_NA together with multiple IA_PD stanzas. Ensure IA_NA
# can be satisfied so the server returns full usable DHCPv6 responses.
dhcp-range=fd03:17ac:e938:4100::100,fd03:17ac:e938:4100::1ff,64,24h

# Prefix Delegation pool - AT&T behavior: drip-fed /64 delegations.
#
# Pool of 8 x /64 prefixes from fd03:17ac:e938:4140::/61.
# Each IA-PD request from dhcp6c receives one /64 from this pool.
# dhcp6c should be configured with ia-pd stanzas for each expected /64
# (ia-pd 2 through ia-pd 9 if ia-pd 0 and ia-pd 1 are used for Xfinity).
#
# "Drip" behavior in the real world means dhcp6c may need to SOLICIT multiple
# times to get all 8; in the lab, all available /64s are handed out
# immediately but each IA-PD gets exactly one /64.
#
# dnsmasq 2.91: spanning ranges (start!=end) with PD trigger "inconsistent
# DHCPv6 range"; workaround is one line per /64 with start==end.  dnsmasq
# still pools them — each IA-PD request consumes one entry.
#
dhcp-range=fd03:17ac:e938:4140::,fd03:17ac:e938:4140::,64,48h
dhcp-range=fd03:17ac:e938:4141::,fd03:17ac:e938:4141::,64,48h
dhcp-range=fd03:17ac:e938:4142::,fd03:17ac:e938:4142::,64,48h
dhcp-range=fd03:17ac:e938:4143::,fd03:17ac:e938:4143::,64,48h
dhcp-range=fd03:17ac:e938:4144::,fd03:17ac:e938:4144::,64,48h
dhcp-range=fd03:17ac:e938:4145::,fd03:17ac:e938:4145::,64,48h
dhcp-range=fd03:17ac:e938:4146::,fd03:17ac:e938:4146::,64,48h
dhcp-range=fd03:17ac:e938:4147::,fd03:17ac:e938:4147::,64,48h

# DHCPv6 options
dhcp-option=option6:dns-server,[2600:1700:60f0:2540::1],[2001:558:feed::1]

# Log DHCP transactions for debugging
log-dhcp

# ── Verification ─────────────────────────────────────────────────────────────
# From the lab firewall WAN2 console:
#   cat /var/db/ipv6-ha/dhcp6c-delegations.json
#
# Expected: up to 8 entries with prefixes from the fd03:17ac:e938:4140::/60 pool.
# The number received depends on how many ia-pd stanzas dhcp6c sends.
#
# To test drip behavior, start with one ia-pd and add more to see
# each successive /64 appear in the delegation JSON.

# ── Alternative: ISC DHCP (more explicit PD control) ─────────────────────────
# subnet6 fd03:17ac:e938:4100::/64 {
#     # Pool of 8 x /64 prefixes - each IA-PD gets one
#     pool6 {
#         prefix6 fd03:17ac:e938:4140:: fd03:17ac:e938:4147:: /64;
#     }
#     option dhcp6.name-servers 2600:1700:60f0:2540::1, 2001:558:feed::1;
# }
