#!/bin/sh
# OPNsense HA Singleton Configuration File
# Lab Environment - Secondary Firewall (lab-fw-secondary)
#
# Network layout:
#   WAN  (vtnet0) - VLAN 210 - Simulated Xfinity  (10.220.10.x, fd03:17ac:e938:4000::/64)
#   WAN2 (vtnet1) - VLAN 211 - Simulated AT&T     (10.220.11.x, fd03:17ac:e938:4100::/64)
#   LAN  (vtnet2) - VLAN 212 - Lab LAN             (10.220.1.0/24, fd03:17ac:e938:4200::/64)
#   PFSYNC (vtnet3) - VLAN 213                     (10.220.3.2 primary, 10.220.3.3 secondary)
#
# Primary LAN IP:   10.220.1.2 / fd03:17ac:e938:4200::2
# Secondary LAN IP: 10.220.1.3 / fd03:17ac:e938:4200::3
# CARP VIP:         10.220.1.1 / fd03:17ac:e938:4200::1

# WAN interfaces are auto-discovered from /conf/config.xml at startup.

SERVICES="rtsold dhcp6c radvd"

# Alternate default routes — when this node is BACKUP, route through primary.
ALT_DEFROUTE_IPV4="10.220.1.2"                    # Primary FW LAN IP
ALT_DEFROUTE_IPV6="fd03:17ac:e938:4200::2"        # Primary FW LAN IPv6

ENABLE_IPV6="yes"
ENABLE_SERVICE_MANAGEMENT="yes"
ENABLE_ROUTE_MANAGEMENT="yes"
ENABLE_INTERFACE_RECONFIGURE="yes"
ENABLE_DHCP_LEASE_CLEARING="yes"

DEBUG="yes"

INTERFACE_SETTLE_TIME="2"
SERVICE_STARTUP_DELAY="1"
