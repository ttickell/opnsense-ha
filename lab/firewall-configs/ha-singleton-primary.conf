#!/bin/sh
# OPNsense HA Singleton Configuration File
# Lab Environment - Primary Firewall (lab-fw-primary)
#
# Network layout:
#   WAN  (vtnet0) - VLAN 210 - Simulated Xfinity  (10.220.10.x, fd03:17ac:e938:4000::/64)
#   WAN2 (vtnet1) - VLAN 211 - Simulated AT&T     (10.220.11.x, fd03:17ac:e938:4100::/64)
#   LAN  (vtnet2) - VLAN 212 - Lab LAN             (10.220.1.0/24, fd03:17ac:e938:4200::/64)
#   PFSYNC (vtnet3) - VLAN 213                     (10.220.3.0/30)
#
# Primary LAN IP:   10.220.1.2 / fd03:17ac:e938:4200::2
# Secondary LAN IP: 10.220.1.3 / fd03:17ac:e938:4200::3
# CARP VIP:         10.220.1.1 / fd03:17ac:e938:4200::1

# WAN device names (kernel interface names for ifconfig up/down)
WAN_INTS="vtnet0 vtnet1"

# OPNsense interface name to kernel device name mapping (for configctl)
WAN_INTERFACE_MAP="wan:vtnet0 wan2:vtnet1"

# IPv6 services to start (MASTER) / stop (BACKUP)
SERVICES="rtsold dhcp6c radvd"

# Alternate default routes — used when this node is BACKUP.
# Traffic routes through the OTHER firewall's LAN IP.
ALT_DEFROUTE_IPV4="10.220.1.3"                    # Secondary FW LAN IP
ALT_DEFROUTE_IPV6="fd03:17ac:e938:4200::3"        # Secondary FW LAN IPv6

# Feature toggles
ENABLE_IPV6="yes"
ENABLE_SERVICE_MANAGEMENT="yes"
ENABLE_ROUTE_MANAGEMENT="yes"
ENABLE_INTERFACE_RECONFIGURE="yes"  # DHCP lease renewal on MASTER transition
ENABLE_DHCP_LEASE_CLEARING="yes"    # Clear stale leases before interface restart

# Debug mode — recommended during lab testing
DEBUG="yes"

# Timing
INTERFACE_SETTLE_TIME="2"
SERVICE_STARTUP_DELAY="1"
